<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title th:text="${myUserName}"></title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
<main class="container">
    <div class="row">
        <aside class="col-md-4">
            <section class="mt-3">
                <div class="mb-3">
                    <div class="row g-0">
                        <div
                                class="col-md-4 d-flex align-items-center justify-content-center"
                        >
                            <span style="font-size: 100px" class="material-icons">person</span>
                        </div>
                        <div class="col-md-8">
                            <div>
                                <h5 th:text="${myUserName}"></h5>
                                <span
                                ><span th:text="${myFollowNumber}"></span
                                ><small class="text-muted">フォロー</small></span
                                >
                                <span
                                ><span th:text="${myFollowerNumber}"></span
                                ><small class="text-muted">フォロワー</small></span
                                >
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </aside>

        <div class="col-md-8">
            <h3>ユーザー一覧</h3>
            <div class="card mb-3" th:each="user : ${userList}">
                <div class="row g-0">
                    <div
                            class="col-md-2 d-flex align-items-center justify-content-center"
                    >
                        <span style="font-size: 100px" class="material-icons">person</span>
                    </div>
                    <div class="col-md-10">
                        <div class="card-body">
                            <h5 class="card-title">
                                <span th:text="${user.name}"></span>
                            </h5>
                            <form th:if="${!myFollowList.contains(user.userId)}" th:action="@{/followuser}" method="post">
                                <input type="hidden" name="followedUserId" th:value="${user.userId}" />
                                <input type="hidden" name="page" th:value="${page}" />
                                <button type="submit" class="btn btn-primary">フォロー</button>
                            </form>
                            <form th:if="${myFollowList.contains(user.userId)}" th:action="@{/unfollowuser}" method="post">
                                <input type="hidden" name="followedUserId" th:value="${user.userId}" />
                                <input type="hidden" name="page" th:value="${page}" />
                                <button type="submit" class="btn btn-danger">フォロー解除</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item">
                        <th:block th:if="${page - 1} > 0">
                            <a class="page-link" th:href="@{users?page={page}(page=${page - 1})}">前へ</a>
                        </th:block>
                        <th:block th:if="${page - 1} <= 0">
                            <a class="page-link" href="#">前へ</a>
                        </th:block>
                    </li>
                    <li class="page-item"><a class="page-link" th:href="@{users?page={page}(page=${page})}"
                                             th:text="${page}"></a></li>
                    <li class="page-item"><a class="page-link" th:href="@{users?page={page}(page=${page + 1 })}"
                                             th:text="${page + 1}"></a></li>
                    <li class="page-item"><a class="page-link" th:href="@{users?page={page}(page=${page + 2})}"
                                             th:text="${page + 2}"></a></li>
                    <li class="page-item">
                        <a class="page-link" th:href="@{users?page={page}(page=${page + 1})}">次へ</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
</body>
</html>
