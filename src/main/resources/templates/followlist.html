<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title th:text="${userName} + のフォロー">○○のフォロー</title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
<main class="container">
    <div class="row">
        <div class="col-md-8">
            <h3 th:text="${userName} + のフォロー">○○のフォロー</h3>
            <div class="card mb-3" th:each="user : ${followingUsers}">
                <div class="row g-0">
                    <div
                            class="col-md-2 d-flex align-items-center justify-content-center"
                    >
                        <span style="font-size: 100px" class="material-icons">person</span>
                    </div>
                    <div class="col-md-10">
                        <div class="card-body">
                            <h5 class="card-title">
                                <a th:href="@{/userprofile(userId=${user.userId})}" th:text="${user.name}">ユーザー名</a>
                            </h5>

                            <div th:replace="~{fragment :: followbutton(
                                                ${myUserId}, ${user}, '/followlist?userId=' + ${userId} + '&page=' + ${page})}">
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragment :: pagination('followlist', ${userId}, ${page})}"></div>
        </div>
    </div>
</main>

</body>
</html>
