<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>フォロワー</title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
<main class="container">
  <div class="row">
    <div class="col-md-8">
      <h3>フォロワー</h3>
      <div class="card mb-3" th:each="user : ${followedUsers}">
        <div class="row g-0">
          <div
                  class="col-md-2 d-flex align-items-center justify-content-center"
          >
            <span style="font-size: 100px" class="material-icons">person</span>
          </div>
          <div class="col-md-10" th:action="@{/userprofile}" th:name="userId" th:value="${user.userId}">
            <div class="card-body">
              <h5 class="card-title">
                <a th:href="@{/userprofile?userId={userId}(userId=${user.userId})}" th:text="${user.name}"></a>
              </h5>

              <th:block th:if="${myUserId} != ${user.userId}">
              <form th:action="@{/follow(returnTo='/followerlist?userId=' + ${userId}
                              + '&page=' + ${page})}" method="post">
                <input th:type="${user.isFollowing} ? hidden: submit"
                       class="btn btn-primary"
                       th:value="フォロー"
                />
                <input type="hidden" name="followedUser" th:value="${user.userId}">
              </form>
              <form th:action="@{/delete-follow(returnTo='/followerlist?userId=' + ${userId}
                              + '&page=' + ${page})}" method="post">
                <input th:type="${user.isFollowing} ? submit: hidden"
                       class="btn btn-primary"
                       th:value="フォロー解除"
                />
                <input type="hidden" name="followedUser" th:value="${user.userId}">
              </form>
              </th:block>
            </div>
          </div>
        </div>
      </div>

      <nav aria-label="Page navigation example">
        <ul class="pagination">
          <li class="page-item">
            <th:block th:if="${page - 1} > 0">
              <a class="page-link" th:href="@{followerlist(userId=${userId}, page=${page - 1})}">前へ</a>
            </th:block>
            <th:block th:if="${page - 1} <= 0">
              <a class="page-link" href="#">前へ</a>
            </th:block>
          </li>
          <li class="page-item"><a class="page-link" th:href="@{followerlist(userId=${userId}, page=${page})}"
                                   th:text="${page}"></a></li>
          <li class="page-item"><a class="page-link"
                                   th:href="@{followerlist(userId=${userId}, page=${page + 1 })}"
                                   th:text="${page + 1}"></a></li>
          <li class="page-item"><a class="page-link" th:href="@{followerlist(userId=${userId}, page=${page + 2})}"
                                   th:text="${page + 2}"></a></li>
          <li class="page-item">
            <a class="page-link" th:href="@{followerlist(userId=${userId}, page=${page + 1})}">次へ</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</main>

</body>
</html>
