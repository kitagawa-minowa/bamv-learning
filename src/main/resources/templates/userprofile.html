<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title th:text="${user.name}"></title>
</head>
<body>
<span th:replace="~{header :: header}"></span>
<main class="container">
  <div class="row">
    <aside class="col-md-4">
      <section class="mt-3">
        <div class="mb-3">
          <div class="row g-0">
            <div
                    class="col-md-4 d-flex align-items-center justify-content-center"
            >
              <span style="font-size: 100px" class="material-icons">person</span>
            </div>
            <div class="col-md-8">
              <div>
                <h5 th:text="${user.name}"></h5>
                <a th:href="@{followlist(userId=${user.userId})}">
                <span
                ><span th:text="${followNumber}"></span
                ><small class="text-muted">フォロー</small></span
                >
                </a>
                <a th:href="@{followerlist(userId=${user.userId})}">
                <span
                ><span th:text="${followerNumber}"></span
                ><small class="text-muted">フォロワー</small></span
                >
                </a>

                <div th:replace="~{fragment :: followbutton(
                                    ${myUserId}, ${user}, '/userprofile?userId=' + ${user.userId})}">
                </div>

              </div>
            </div>
          </div>
        </div>
      </section>
    </aside>

    <div class="col-md-8">
      <h3>投稿一覧</h3>
      <div class="card mb-3" th:each="micropost : ${micropostList}">
        <div class="row g-0">
          <div
                  class="col-md-2 d-flex align-items-center justify-content-center"
          >
            <span style="font-size: 100px" class="material-icons">person</span>
          </div>
          <div class="col-md-10">
            <div class="card-body">
              <h5 class="card-title">
                <span th:text="${micropost.name}"></span>
              </h5>
              <p class="card-text" th:text="${micropost.content}">
              </p>
              <p class="card-text">
                <small class="text-muted"
                       th:text="${#dates.format(
                                       new java.util.Date(
                                           micropost.postedDatetime
                                       ), 'yyyy-MM-dd hh:mm:ss')}">
                </small>
              </p>
            </div>
          </div>
        </div>
      </div>


      <div th:replace="~{fragment :: pagination('userprofile', ${user.userId}, ${page})}"></div>
    </div>
  </div>
</main>
</body>
</html>
